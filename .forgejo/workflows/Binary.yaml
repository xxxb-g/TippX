name: Build Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: debian:stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            python3 python3-pip python3-venv \
            build-essential \
            wine wine32 wine64 \
            fakeroot dpkg-dev \
            libssl-dev \
            libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Install Python build tools
        run: |
          pip3 install nuitka pyinstaller pygame requests

      - name: Build Linux + Windows binaries
        run: make release

      - name: Build .deb package
        working-directory: ./deb
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TippX-builds
          path: |
            ./TippX
            ./main.dist/
            ./deb/Package.deb
